image: node:24-bookworm-slim

workflow:
  rules:
  # Run on merge requests
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  # Run on main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Run when a new tag is pushed
    - if: $CI_COMMIT_TAG
  # Run on staging branch
    - if: $CI_COMMIT_BRANCH == "staging"

# Define stages
stages:
  - lint
  - build
  - test
  - release

# default cache and before_script
default:
  cache:
    key:
      prefix: $CI_COMMIT_REF_NAME
      files:
        - server/package-lock.json
        - client/package-lock.json
    paths:
      - server/.npm/
      - client/.npm/
  before_script:
    # Install server and client dependencies using cached npm
    - cd server && npm ci --cache .npm --prefer-offline && cd ../client && npm ci --cache .npm --prefer-offline && cd ..

# Run lint on server js files
lint-server:
  stage: lint
  script:
    - cd server && ./node_modules/eslint/bin/eslint.js --ext js,jsx,mjs,cjs . 
  allow_failure: false

# Run lint on client js files
lint-client:
  stage: lint
  script:
    - cd client && ./node_modules/eslint/bin/eslint.js --ext js,jsx,mjs,cjs .
  allow_failure: false

# A server-side test job
test-server:
  stage: test
  script:
    - cd server/test && npm test

# A client-side build job
build-client:
  stage: build
  script:
  - cd client && npm run build && npm run bundlesize
  artifacts:
    expire_in: 1 week
    when: on_success
    paths:
      - client/dist

# Release job to produce a tar.gz artifact
build-app-archive:
  stage: release
  variables:
    RELEASE_FILE: release-$CI_PROJECT_NAME-$CI_COMMIT_TAG-$CI_COMMIT_SHORT_SHA.tar.gz
  dependencies:
    - build-client
  rules:
    # Run only when a tag is pushed => TESTING NOW 
    - if: $CI_COMMIT_TAG
  before_script:
    # Install only production dependencies
    - cd server && npm ci --omit=dev && cd ..
  script: 
    # This is supposed to make an archive that excludes the ./npm and client modules
    - tar -zcvf $RELEASE_FILE \
      --exclude='server/.npm' \
      --exclude='client/.npm' \
      --exclude='client/node_modules' \
      server \
      server/node_modules \
      client/dist
  artifacts:
    name: $RELEASE_FILE
    paths:
      - $RELEASE_FILE
    expire_in: 1 week



